<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catálogo Impresión 3D</title>
  <!-- Script oficial de Google Model-Viewer -->
  <script type="module" src="Portaaudifonos.glb"></script>
  <style>
    body { font-family: Arial, sans-serif; background-color: #f4f4f9; padding: 20px; text-align: center; }
    h1 { color: #333; }
    
    /* Galería de productos */
    .catalogo-grid {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 30px;
      margin-top: 20px;
    }
    
    /* Tarjeta individual para cada objeto */
    .producto-card {
      background: #ffffff;
      border-radius: 12px;
      padding: 15px;
      width: 320px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }

    model-viewer {
      width: 100%;
      height: 300px;
      background-color: #fafafa;
      border-radius: 8px;
    }

    .controls { margin-top: 10px; }
    .color-btn {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: 2px solid #ccc;
      cursor: pointer;
      margin: 3px;
      display: inline-block;
    }
  </style>
</head>
<body>

  <h1>Catálogo Interactivo 3D</h1>
  <p>Selecciona un producto, rota el modelo e inspecciona el color en tiempo real:</p>

  <div class="catalogo-grid">

    <!-- OBJETO 1 -->
    <div class="producto-card">
      <h3>Soporte para Audífonos</h3>
      <model-viewer id="objeto1" src="Portaaudifonos.glb" ar camera-controls touch-action="pan-y" alt="Portaaudifonos.glb"></model-viewer>
      <div class="controls">
        <p><small>Color de Filamento:</small></p>
        <div class="color-btn" style="background-color: #ff0000;" onclick="cambiarColor('objeto1', '#ff0000')"></div>
        <div class="color-btn" style="background-color: #0000ff;" onclick="cambiarColor('objeto1', '#0000ff')"></div>
        <div class="color-btn" style="background-color: #000000;" onclick="cambiarColor('objeto1', '#000000')"></div>
        <div class="color-btn" style="background-color: #ffffff;" onclick="cambiarColor('objeto1', '#ffffff')"></div>
      </div>
    </div>

    <!-- OBJETO 2 (Duplica este bloque para añadir un nuevo producto) -->
    <div class="producto-card">
      <h3>Nombre del Nuevo Objeto</h3>
      <!-- Asegúrate de cambiar la 'id' a objeto2 y poner el nombre de tu nuevo archivo .glb en 'src' -->
      <model-viewer id="objeto2" src="NUEVO_ARCHIVO.glb" ar camera-controls touch-action="pan-y" alt="Nuevo Objeto"></model-viewer>
      <div class="controls">
        <p><small>Color de Filamento:</small></p>
        <div class="color-btn" style="background-color: #ff0000;" onclick="cambiarColor('objeto2', '#ff0000')"></div>
        <div class="color-btn" style="background-color: #0000ff;" onclick="cambiarColor('objeto2', '#0000ff')"></div>
        <div class="color-btn" style="background-color: #000000;" onclick="cambiarColor('objeto2', '#000000')"></div>
        <div class="color-btn" style="background-color: #ffffff;" onclick="cambiarColor('objeto2', '#ffffff')"></div>
      </div>
    </div>

  </div>

  <script>
    // Función para cambiar el color especificando el ID de cada visor 3D
    function cambiarColor(idVisor, colorHex) {
      const visor = document.getElementById(idVisor);
      if (visor && visor.model) {
        const [material] = visor.model.materials;
        material.pbrMetallicRoughness.setBaseColorFactor(colorHex);
      }
    }
  </script>

</body>
</html>
