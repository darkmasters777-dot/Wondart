<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catálogo Impresión 3D</title>
  <!-- Script oficial de Google Model-Viewer -->
  <script type="module" src="soporteaudifono"></script>
  <style>
    body { font-family: Arial, sans-serif; text-align: center; background-color: #f4f4f9; padding: 20px; }
    model-viewer { width: 100%; height: 400px; background-color: #ffffff; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
    .controls { margin-top: 15px; }
    .color-btn { width: 35px; height: 35px; border-radius: 50%; border: 2px solid #ccc; cursor: pointer; margin: 5px; display: inline-block; }
  </style>
</head>
<body>

  <h1>Catálogo Interactivo 3D</h1>
  <p>Rota el modelo y selecciona el color de impresión deseado:</p>

  <!-- Visor 3D -->
  <model-viewer id="visor3d" src="tu_modelo.glb" ar camera-controls touch-action="pan-y" alt="Modelo 3D"></model-viewer>

  <!-- Botones de Cambio de Color -->
  <div class="controls">
    <p><strong>Color de Filamento / Resina:</strong></p>
    <div class="color-btn" style="background-color: #ff0000;" onclick="cambiarColor('#ff0000')"></div>
    <div class="color-btn" style="background-color: #008000;" onclick="cambiarColor('#008000')"></div>
    <div class="color-btn" style="background-color: #0000ff;" onclick="cambiarColor('#0000ff')"></div>
    <div class="color-btn" style="background-color: #000000;" onclick="cambiarColor('#000000')"></div>
    <div class="color-btn" style="background-color: #ffffff;" onclick="cambiarColor('#ffffff')"></div>
  </div>

  <script>
    // Función para cambiar el color del material base del modelo 3D
    function cambiarColor(colorHex) {
      const visor = document.querySelector('#visor3d');
      const [material] = visor.model.materials;
      material.pbrMetallicRoughness.setBaseColorFactor(colorHex);
    }
  </script>

</body>
</html>
